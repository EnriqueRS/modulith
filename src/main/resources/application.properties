# H2 Database
spring.datasource.url=jdbc:h2:mem:ticketsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console (depuración)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# SPRING MODULITH
# ============================================================

# Registro persistente de eventos (tabla event_publication):
# al arrancar, re-publica los eventos incompletos (p. ej. si Seats o
# Notification fallaron en un intento anterior).
# NOTA: en Modulith >= 1.4 la property es "-on-restart" (antes "-on-startup").
spring.modulith.events.republish-outstanding-events-on-restart=true

# Modo de completado de publicaciones: UPDATE conserva el historial en la tabla
# (auditables y visibles en H2). Alternativa: DELETE (borra al completar).
spring.modulith.events.completion-mode=UPDATE

# Actuator: expone la estructura de módulos y las métricas de eventos
#   GET /actuator/modulith                      -> módulos y dependencias
#   GET /actuator/metrics/modulith.events.processed -> eventos procesados
#                                                       (tags: event_type, module_name)
management.endpoints.web.exposure.include=health,info,modulith,metrics
