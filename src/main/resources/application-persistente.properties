# Perfil "persistente": H2 en fichero, para demos del Event Publication Registry.
# Los datos (y las publicaciones incompletas pendientes de reintento) sobreviven
# al reinicio de la app, cosa que la BD en memoria no permite.
#
# Arrancar con:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=persistente
#
# La consola H2 pasa a usar esta JDBC URL: jdbc:h2:file:./data/ticketsdb
spring.datasource.url=jdbc:h2:file:./data/ticketsdb;DB_CLOSE_ON_EXIT=FALSE
